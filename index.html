<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地图片浏览器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a18; color: #e0e0dc; min-height: 100vh; }
  .toolbar { position: sticky; top: 0; z-index: 100; background: #252523; border-bottom: 0.5px solid #3a3a36; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toolbar h1 { font-size: 15px; font-weight: 500; color: #e0e0dc; flex-shrink: 0; }
  .btn-select { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; background: #e0e0dc; color: #1a1a18; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-select:hover { background: #fff; }
  .stats { font-size: 12px; color: #888; margin-left: auto; flex-shrink: 0; }
  .filter-summary { font-size: 11px; color: #999; padding: 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .filter-summary span { white-space: nowrap; }
  .search-wrap { position: relative; }
  .search-wrap input { padding: 6px 12px 6px 30px; border: 0.5px solid #3a3a36; border-radius: 8px; font-size: 13px; font-family: inherit; width: 200px; background: #1e1e1c; color: #e0e0dc; outline: none; }
  .search-wrap input:focus { border-color: #666; background: #2a2a26; }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 13px; pointer-events: none; }
  .filter-bar { padding: 6px 20px; background: #252523; border-bottom: 0.5px solid #3a3a36; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .filter-bar span { font-size: 12px; color: #888; margin-right: 4px; }
  .filter-bar .sep { width: 1px; height: 18px; background: #3a3a36; margin: 0 6px; }
  .chip { padding: 4px 10px; border-radius: 20px; border: 0.5px solid #3a3a36; font-size: 12px; cursor: pointer; background: #1e1e1c; color: #999; font-family: inherit; transition: all 0.15s; }
  .chip:hover { border-color: #666; color: #e0e0dc; }
  .chip.active { background: #e0e0dc; color: #1a1a18; border-color: #e0e0dc; }
  .show-filtered { font-size: 12px; color: #888; cursor: pointer; border: none; background: none; font-family: inherit; text-decoration: underline; padding: 2px 4px; }
  .show-filtered:hover { color: #e0e0dc; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; color: #666; }
  .empty .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.25; }
  .empty p { font-size: 14px; }
  .empty small { font-size: 12px; margin-top: 6px; color: #555; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding: 16px 20px; }
  .card { background: #252523; border: 0.5px solid #3a3a36; border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
  .card:hover { border-color: #666; transform: translateY(-1px); }
  .card.selected { border-color: #e0e0dc; border-width: 1.5px; }
  .card.filtered { opacity: 0.4; border-style: dashed; }
  .card.filtered .filter-tag { display: inline-block; }
  .filter-tag { display: none; font-size: 10px; padding: 1px 6px; border-radius: 10px; background: #4a1b0c; color: #f0997b; margin-left: 4px; vertical-align: middle; }
  .thumb { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #1e1e1c; }
  .thumb-placeholder { width: 100%; aspect-ratio: 1; background: #1e1e1c; display: flex; align-items: center; justify-content: center; color: #444; font-size: 28px; }
  .card-info { padding: 8px 10px; }
  .card-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e0e0dc; }
  .card-size { font-size: 11px; color: #888; margin-top: 2px; }
  .card-reason { font-size: 10px; color: #f0997b; margin-top: 1px; }
  .path-panel { position: sticky; bottom: 0; background: #252523; border-top: 0.5px solid #3a3a36; padding: 12px 20px; display: none; z-index: 100; }
  .path-panel.visible { display: flex; align-items: center; gap: 10px; }
  .path-label { font-size: 12px; color: #888; flex-shrink: 0; }
  .path-value { font-size: 12px; font-family: "Consolas", "Monaco", monospace; color: #e0e0dc; word-break: break-all; flex: 1; background: #1e1e1c; padding: 6px 10px; border-radius: 6px; border: 0.5px solid #3a3a36; }
  .btn-copy { padding: 5px 12px; border: 0.5px solid #3a3a36; border-radius: 6px; font-size: 12px; cursor: pointer; background: #1e1e1c; font-family: inherit; flex-shrink: 0; color: #999; }
  .btn-copy:hover { background: #2a2a26; color: #e0e0dc; }
  .btn-copy.copied { background: #173404; color: #97c459; border-color: #3b6d11; }
  .progress-bar { height: 3px; background: #3a3a36; border-radius: 2px; overflow: hidden; width: 160px; }
  .progress-fill { height: 100%; background: #e0e0dc; border-radius: 2px; transition: width 0.2s; }
  .sort-select { padding: 5px 10px; border: 0.5px solid #3a3a36; border-radius: 8px; font-size: 12px; font-family: inherit; background: #1e1e1c; color: #999; cursor: pointer; outline: none; }
  #loadingOverlay { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(20,20,18,0.82); backdrop-filter: blur(2px); flex-direction: column; align-items: center; justify-content: center; gap: 20px; cursor: not-allowed; user-select: none; }
  #loadingOverlay.active { display: flex; }
  .overlay-box { background: #252523; border: 0.5px solid #3a3a36; border-radius: 14px; padding: 28px 36px; display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 260px; }
  .overlay-label { font-size: 13px; color: #e0e0dc; font-weight: 500; }
  .overlay-sub { font-size: 11px; color: #888; }
  .overlay-bar { width: 200px; height: 4px; background: #3a3a36; border-radius: 4px; overflow: hidden; }
  .overlay-fill { height: 100%; background: #e0e0dc; border-radius: 4px; transition: width 0.25s ease; width: 0%; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>&#x1F4C1; 本地图片浏览器</h1>
  <span style="font-size:11px;color:#666;flex-shrink:0;">售后维护：黄国威</span>
  <button class="btn-select" onclick="selectFolder()" id="selectBtn">选择文件夹</button>
  <div class="search-wrap">
    <span class="search-icon">&gt;</span>
    <input type="text" id="searchInput" placeholder="搜索文件名..." oninput="applyFilters()">
  </div>
  <select class="sort-select" id="sortSelect" onchange="applyFilters()">
    <option value="name-asc">文件名 A-Z</option>
    <option value="name-desc">文件名 Z-A</option>
    <option value="size-desc">大小 大-小</option>
    <option value="size-asc">大小 小-大</option>
    <option value="type">按类型</option>
  </select>
  <span class="stats" id="stats"></span>
</div>

<div class="filter-bar" id="filterBar" style="display:none;">
  <span>格式：</span>
  <button class="chip active" data-ext="all" onclick="filterExt(this)">全部</button>
  <span class="sep"></span>
  <div class="filter-summary" id="filterSummary"></div>
</div>

<div id="mainContent">
  <div class="empty">
    <div class="icon">&#x1F5BC;</div>
    <p>点击「选择文件夹」浏览目录中的图片</p>
    <small>自动过滤：重复图片、动画图片(GIF/APNG/WebP动画)、大尺寸背景图</small>
  </div>
</div>

<div class="path-panel" id="pathPanel">
  <span class="path-label">路径：</span>
  <span class="path-value" id="pathValue"></span>
  <button class="btn-copy" id="copyBtn" onclick="copyPath()">复制</button>
</div>

<input type="file" id="folderInput" webkitdirectory multiple accept="image/*" style="display:none" onchange="handleFiles(this)">

<div id="loadingOverlay">
  <div class="overlay-box">
    <div class="overlay-label" id="overlayLabel">正在扫描图片…</div>
    <div class="overlay-bar"><div class="overlay-fill" id="overlayFill"></div></div>
    <div class="overlay-sub" id="overlaySub">请稍候</div>
  </div>
</div>

<script>
const IMAGE_EXTS = new Set(['jpg','jpeg','png','gif','webp','bmp','svg','avif','ico','tiff','tif','heic','heif','jfif','pjpeg','pjp']);
const DUPLICATE = 'duplicate';
const ANIMATED = 'animated';
const LARGE_BG = 'large_bg';

let allItems = [];
let selectedCard = null;
let currentExt = 'all';
let showFiltered = false;
let filterStats = { duplicate: 0, animated: 0, large_bg: 0 };

function selectFolder() {
  document.getElementById('folderInput').value = '';
  document.getElementById('folderInput').click();
}

function setProgress(pct, label, sub) {
  document.getElementById('overlayFill').style.width = pct + '%';
  if (label) document.getElementById('overlayLabel').textContent = label;
  if (sub !== undefined) document.getElementById('overlaySub').textContent = sub;
}

async function handleFiles(input) {
  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('active');
  setProgress(0, '正在扫描图片…', '请稍候');
  // yield to browser so overlay renders before heavy work
  await new Promise(r => setTimeout(r, 30));

  const selectBtn = document.getElementById('selectBtn');
  selectBtn.disabled = true;
  showFiltered = false;
  filterStats = { duplicate: 0, animated: 0, large_bg: 0 };

  const allImageFiles = Array.from(input.files).filter(f => {
    const ext = f.name.split('.').pop().toLowerCase();
    return IMAGE_EXTS.has(ext);
  });

  const total = allImageFiles.length;
  setProgress(5, '正在扫描图片…', '共发现 ' + total + ' 张');
  await new Promise(r => setTimeout(r, 10));

  const items = allImageFiles.map(f => ({
    file: f,
    name: f.name,
    ext: f.name.split('.').pop().toLowerCase(),
    size: f.size,
    path: f.webkitRelativePath || f.name,
    url: null,
    filter: null,
    width: 0,
    height: 0,
    dupKey: f.name
  }));

  // Step 1: Deduplicate
  const seen = new Map();
  const deduped = [];
  for (const item of items) {
    if (seen.has(item.dupKey)) {
      item.filter = DUPLICATE;
      filterStats.duplicate++;
    } else {
      seen.set(item.dupKey, item.dupKey);
    }
    deduped.push(item);
  }
  setProgress(20, '检测动画图片…', '去重完成，剩余 ' + deduped.filter(i=>!i.filter).length + ' 张');
  await new Promise(r => setTimeout(r, 10));

  // Step 2: Check animation (GIF, APNG, WebP anim) - read file headers
  const animExts = new Set(['gif', 'png', 'webp']);
  const animTargets = deduped.filter(item => !item.filter && animExts.has(item.ext));
  let animDone = 0;
  const animChecks = animTargets.map(async item => {
    const isAnim = await checkAnimated(item);
    if (isAnim) { item.filter = ANIMATED; filterStats.animated++; }
    animDone++;
    if (animTargets.length > 0) {
      setProgress(20 + Math.round(30 * animDone / animTargets.length), '检测动画图片…',
        animDone + ' / ' + animTargets.length);
    }
  });
  await Promise.all(animChecks);
  setProgress(50, '检测大尺寸背景图…', '动画检测完成');
  await new Promise(r => setTimeout(r, 10));

  // Step 3: Check large background - load image, check dimensions
  const dimTargets = deduped.filter(item => !item.filter);
  let dimDone = 0;
  const dimChecks = dimTargets.map(async item => {
    const isLarge = await checkLargeBg(item);
    if (isLarge) { item.filter = LARGE_BG; filterStats.large_bg++; }
    dimDone++;
    if (dimTargets.length > 0) {
      setProgress(50 + Math.round(40 * dimDone / dimTargets.length), '检测大尺寸背景图…',
        dimDone + ' / ' + dimTargets.length);
    }
  });
  await Promise.all(dimChecks);

  allItems = deduped;
  selectedCard = null;
  document.getElementById('pathPanel').className = 'path-panel';

  setProgress(95, '渲染图片列表…', '即将完成');
  await new Promise(r => setTimeout(r, 30));

  buildExtFilters();
  applyFilters();

  setProgress(100, '加载完成', '');
  await new Promise(r => setTimeout(r, 350));
  overlay.classList.remove('active');
  selectBtn.disabled = false;
}

async function checkAnimated(item) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      const bytes = new Uint8Array(reader.result);
      if (item.ext === 'gif') {
        resolve(isAnimatedGIF(bytes));
      } else if (item.ext === 'png') {
        resolve(isAPNG(bytes));
      } else if (item.ext === 'webp') {
        resolve(isAnimatedWebP(bytes));
      } else {
        resolve(false);
      }
    };
    reader.onerror = () => resolve(false);
    // Read enough bytes to detect animation headers
    // GIF: need whole file to count image descriptors (usually small files)
    // PNG: first 64KB should contain acTL if present
    // WebP: first 64KB should contain ANIM if present
    const size = item.ext === 'gif' ? item.file.size : Math.min(item.file.size, 65536);
    reader.readAsArrayBuffer(item.file.slice(0, size));
  });
}

function isAnimatedGIF(bytes) {
  if (bytes.length < 13) return false;
  let count = 0;
  for (let i = 0; i < bytes.length - 1; i++) {
    if (bytes[i] === 0x2C) {
      // 0x2C is Image Descriptor - but could be part of comment/extension data
      // Check context: preceding byte should be 0x00 (terminator) or 0x3B (trailer)
      // or we're at a chunk boundary. Simple heuristic: skip if inside data.
      // More accurate: look at surrounding context
      // Image Descriptor structure: separator(1) + left(2) + top(2) + width(2) + height(2) + flags(1)
      // width/height must be > 0, flags byte has local color table bit
      if (i + 9 < bytes.length) {
        const w = (bytes[i+5] << 8) | bytes[i+6];
        const h = (bytes[i+7] << 8) | bytes[i+8];
        if (w > 0 && h > 0 && w < 10000 && h < 10000) {
          count++;
        }
      }
    }
  }
  return count > 1;
}

function isAPNG(bytes) {
  if (bytes.length < 8) return false;
  // PNG signature: 137 80 78 71 13 10 26 10
  if (bytes[0] !== 0x89 || bytes[1] !== 0x50 || bytes[2] !== 0x4E || bytes[3] !== 0x47) return false;
  // Scan for acTL chunk
  let offset = 8;
  while (offset + 8 <= bytes.length) {
    const chunkType = String.fromCharCode(bytes[offset+4], bytes[offset+5], bytes[offset+6], bytes[offset+7]);
    if (chunkType === 'acTL') return true;
    if (chunkType === 'IDAT') return false; // past animation metadata area
    const length = (bytes[offset] << 24) | (bytes[offset+1] << 16) | (bytes[offset+2] << 8) | bytes[offset+3];
    offset += 12 + length;
  }
  return false;
}

function isAnimatedWebP(bytes) {
  if (bytes.length < 12) return false;
  // RIFF header: 'RIFF' + size + 'WEBP'
  if (bytes[0] !== 0x52 || bytes[1] !== 0x49 || bytes[2] !== 0x46 || bytes[3] !== 0x46) return false;
  if (bytes[8] !== 0x57 || bytes[9] !== 0x45 || bytes[10] !== 0x42 || bytes[11] !== 0x50) return false;
  // Scan for ANIM chunk
  let offset = 12;
  while (offset + 8 <= bytes.length) {
    const fourCC = String.fromCharCode(bytes[offset], bytes[offset+1], bytes[offset+2], bytes[offset+3]);
    if (fourCC === 'ANIM') return true;
    const chunkSize = (bytes[offset+4]) | (bytes[offset+5] << 8) | (bytes[offset+6] << 16) | (bytes[offset+7] << 24);
    offset += 8 + chunkSize;
    if (offset % 2) offset++; // padding byte
  }
  return false;
}

async function checkLargeBg(item) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(item.file);
    const img = new Image();
    img.onload = () => {
      item.width = img.naturalWidth;
      item.height = img.naturalHeight;
      URL.revokeObjectURL(url);

      const w = img.naturalWidth;
      const h = img.naturalHeight;
      if (w === 0 || h === 0) { resolve(false); return; }

      // Heuristics for large background images:
      // 1. Either dimension > 2400px (typical full-screen bg resolution)
      // 2. Entremely wide aspect ratio (> 3.5:1, e.g. banner sliders)
      // 3. SVG files: skip dimension check entirely
      const ratio = w / h;
      const isLarge = w > 2400 || h > 2400 || ratio > 3.5 || ratio < 0.28;
      resolve(isLarge);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      resolve(false);
    };
    img.src = url;
  });
}

function buildExtFilters() {
  const bar = document.getElementById('filterBar');
  bar.innerHTML = '';

  const visibleExs = [...new Set(allItems.filter(i => !i.filter).map(f => f.ext))].sort();
  const allExts = [...new Set(allItems.map(f => f.ext))].sort();

  if (visibleExs.length === 0 && allExts.length === 0) { bar.style.display = 'none'; return; }

  const label = document.createElement('span');
  label.textContent = '格式：';
  bar.appendChild(label);

  const allBtn = document.createElement('button');
  allBtn.className = 'chip ' + (currentExt === 'all' ? 'active' : '');
  allBtn.dataset.ext = 'all'; allBtn.textContent = '全部';
  allBtn.onclick = () => filterExt(allBtn);
  bar.appendChild(allBtn);

  visibleExs.forEach(ext => {
    const btn = document.createElement('button');
    btn.className = 'chip ' + (currentExt === ext ? 'active' : '');
    btn.dataset.ext = ext;
    btn.textContent = ext.toUpperCase();
    btn.onclick = () => filterExt(btn);
    bar.appendChild(btn);
  });

  if (filterStats.duplicate + filterStats.animated + filterStats.large_bg > 0) {
    const sep = document.createElement('span');
    sep.className = 'sep';
    bar.appendChild(sep);

    const summary = document.createElement('div');
    summary.className = 'filter-summary';
    summary.id = 'filterSummary';
    let parts = [];
    if (filterStats.duplicate > 0) parts.push('\u91CD\u590D ' + filterStats.duplicate);
    if (filterStats.animated > 0) parts.push('\u52A8\u753B ' + filterStats.animated);
    if (filterStats.large_bg > 0) parts.push('\u5927\u80CC\u666F\u56FE ' + filterStats.large_bg);
    summary.textContent = '\u5DF2\u8FC7\u6EE4\uFF1A' + parts.join(' / ');
    bar.appendChild(summary);

    const showBtn = document.createElement('button');
    showBtn.className = 'show-filtered';
    showBtn.textContent = showFiltered ? '\u9690\u85CF\u5DF2\u8FC7\u6EE4' : '\u663E\u793A\u5DF2\u8FC7\u6EE4';
    showBtn.id = 'toggleFilteredBtn';
    showBtn.onclick = toggleFiltered;
    bar.appendChild(showBtn);
  }

  bar.style.display = 'flex';
}

function toggleFiltered() {
  showFiltered = !showFiltered;
  document.getElementById('toggleFilteredBtn').textContent = showFiltered ? '\u9690\u85CF\u5DF2\u8FC7\u6EE4' : '\u663E\u793A\u5DF2\u8FC7\u6EE4';
  applyFilters();
}

function filterExt(btn) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  currentExt = btn.dataset.ext;
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const sort = document.getElementById('sortSelect').value;

  let subset = showFiltered ? allItems : allItems.filter(i => !i.filter);
  let filtered = subset.filter(f => {
    const matchExt = currentExt === 'all' || f.ext === currentExt;
    const matchSearch = !q || f.name.toLowerCase().includes(q);
    return matchExt && matchSearch;
  });

  filtered.sort((a, b) => {
    if (sort === 'name-asc') return a.name.localeCompare(b.name);
    if (sort === 'name-desc') return b.name.localeCompare(a.name);
    if (sort === 'size-desc') return b.size - a.size;
    if (sort === 'size-asc') return a.size - b.size;
    if (sort === 'type') return a.ext.localeCompare(b.ext) || a.name.localeCompare(b.name);
    return 0;
  });

  const totalVisible = allItems.filter(i => !i.filter).length;
  document.getElementById('stats').textContent =
    allItems.length ? '\u663E\u793A ' + filtered.length + ' / ' + totalVisible + ' \u5F20' : '';
  renderGrid(filtered);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

const FILTER_LABELS = { duplicate: '\u91CD\u590D', animated: '\u52A8\u753B', large_bg: '\u5927\u80CC\u666F\u56FE' };

function renderGrid(items) {
  const main = document.getElementById('mainContent');
  if (!items.length) {
    main.innerHTML = allItems.length
      ? '<div class="empty"><div class="icon">&#x1F50D;</div><p>没有匹配的图片</p></div>'
      : '<div class="empty"><div class="icon">&#x1F5BC;</div><p>点击「选择文件夹」浏览目录中的图片</p><small>自动过滤：重复图片、动画图片、大尺寸背景图</small></div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'grid';

  items.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'card';
    if (item.filter) card.classList.add('filtered');
    card.dataset.path = item.path;

    const thumb = document.createElement('img');
    thumb.className = 'thumb';
    thumb.alt = item.name;
    thumb.loading = 'lazy';

    if (!item.url) {
      item.url = URL.createObjectURL(item.file);
    }
    thumb.src = item.url;
    thumb.onerror = () => {
      thumb.style.display = 'none';
      const ph = document.createElement('div');
      ph.className = 'thumb-placeholder';
      ph.textContent = '?';
      card.insertBefore(ph, card.firstChild);
    };

    let nameHtml = item.name;
    if (item.filter) {
      nameHtml += ' <span class="filter-tag" style="display:inline-block">' + FILTER_LABELS[item.filter] + '</span>';
    }

    const dimStr = (item.width && item.height)
      ? (' / ' + item.width + '\xD7' + item.height)
      : '';

    const info = document.createElement('div');
    info.className = 'card-info';
    info.innerHTML = '<div class="card-name" title="' + item.name + '">' + nameHtml + '</div>'
      + '<div class="card-size">' + formatSize(item.size) + dimStr + '</div>';

    card.appendChild(thumb);
    card.appendChild(info);
    card.onclick = () => selectImage(card, item);
    grid.appendChild(card);
  });

  main.innerHTML = '';
  main.appendChild(grid);
}

function selectImage(card, item) {
  if (selectedCard) selectedCard.classList.remove('selected');
  if (selectedCard === card) {
    selectedCard = null;
    document.getElementById('pathPanel').className = 'path-panel';
    return;
  }
  selectedCard = card;
  card.classList.add('selected');
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  document.getElementById('pathValue').textContent = item.path;
  document.getElementById('pathPanel').className = 'path-panel visible';
  document.getElementById('copyBtn').className = 'btn-copy';
  document.getElementById('copyBtn').textContent = '\u590D\u5236';
}

function copyPath() {
  const path = document.getElementById('pathValue').textContent;
  navigator.clipboard.writeText(path).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '\u5DF2\u590D\u5236';
    btn.className = 'btn-copy copied';
    setTimeout(() => { btn.textContent = '\u590D\u5236'; btn.className = 'btn-copy'; }, 2000);
  }).catch(() => {
    const range = document.createRange();
    range.selectNode(document.getElementById('pathValue'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand('copy');
  });
}
</script>
</body>
</html>
